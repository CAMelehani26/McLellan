<script>
(function(){var chico=window.matchMedia("(max-width:768px)").matches;var hero=document.querySelector(".emp-hero");if(!hero)return;var activo=hero.querySelector(chico?".video-mobile":".video-desktop");var otro=hero.querySelector(chico?".video-desktop":".video-mobile");if(otro)otro.remove();if(activo){var f=activo.querySelector("source");if(f&&f.dataset.src){f.src=f.dataset.src;activo.load();activo.play().catch(function(){});}}})();

function toggleFaq(btn) {
  // El boton ahora vive dentro de un H3, asi que el contenedor ya no es el
  // padre directo. closest() lo encuentra sin importar cuantos niveles haya.
  var item = btn.closest('.faq-item');
  var answer = item.querySelector('.faq-answer');
  var isOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(function(el){
    el.classList.remove('open');
    el.querySelector('.faq-answer').style.setProperty('max-height', '0px', 'important');
    // Sin esto el lector de pantalla sigue anunciando "expandido".
    var b = el.querySelector('.faq-question');
    if (b) b.setAttribute('aria-expanded', 'false');
  });
  if (!isOpen) {
    item.classList.add('open');
    answer.style.setProperty('max-height', answer.scrollHeight + 'px', 'important');
    btn.setAttribute('aria-expanded', 'true');
  }
}

// Si la URL trae el ancla de una pregunta, se abre sola y queda a la vista.
// Es lo que hace util tener un link por pregunta.
</script>
