    {
      "@type": "Question",
      "name": "What is a trust accounting in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A trust accounting is the trustee's written report on how the trust has been managed. Under Probate Code section 16063 it must show receipts and disbursements of principal and income, the trust's assets and liabilities, the trustee's compensation, and the agents the trustee hired and what they were paid. It must also tell the beneficiary that they can ask the court to review the account and the trustee's acts."
      }
    },
    {
      "@type": "Question",
      "name": "How often must a trustee provide an accounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Probate Code section 16062 requires the trustee to account at least annually, when the trust terminates, and when there is a change of trustee. The duty runs to each beneficiary to whom income or principal is required, or authorized in the trustee's discretion, to be currently distributed. There are exceptions, including for some trusts created before July 1, 1987."
      }
    },
    {
      "@type": "Question",
      "name": "Can a beneficiary force a trustee to provide an accounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. If the trustee fails to provide a requested account within 60 days after the beneficiary's written request, and no account has been made in the six months before the request, the beneficiary can petition the probate court to compel an accounting under Probate Code section 17200. A clear written demand is usually the first step."
      }
    },
    {
      "@type": "Question",
      "name": "Can the trust document waive the duty to account?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In part. A trust can waive the annual accounting, but under Probate Code section 16064 the court may still compel the trustee to account if it is reasonably likely that a material breach of the trust has occurred. A waiver is also void for certain trustees, such as some trustees who drafted the trust or are closely connected to the person who did."
      }
    },
    {
      "@type": "Question",
      "name": "Does a trustee have to account while the settlor is still alive?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Generally not to the other beneficiaries. While a trust can still be revoked, Probate Code section 16069 provides that the trustee does not owe them an accounting. That usually changes when the settlor dies or becomes incompetent, which is often when accounting disputes begin."
      }
    },
    {
      "@type": "Question",
      "name": "How long do I have to object to a trust accounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Every accounting must warn that claims for breach of trust may not be made more than three years after the beneficiary receives an account or report disclosing the facts behind the claim. Some trusts set a shorter written-objection period, which can be as short as 180 days when the trustee gives the notice Probate Code section 16461 requires. Read each accounting promptly."
      }
    },
    {
      "@type": "Question",
      "name": "What if the accounting shows something wrong?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An accounting that does not add up can support a petition asking the court to settle the account, surcharge the trustee for losses, reduce or deny the trustee's compensation, or take other steps listed in Probate Code section 16420. The right response depends on what the numbers show and how much is at stake."
      }
    },
    {
      "@type": "Question",
      "name": "Can a trustee be removed for failing to account?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It can be part of the case. Under Probate Code section 15642 a court may remove a trustee who has committed a breach of trust, and violating any duty the trustee owes a beneficiary, including the duty to account, is a breach of trust under section 16400. Courts look at the whole picture, not a single late report."
      }
    }
